<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>三角形成长测评 · 蓝鱼青少年自驱力</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --human:#E74C3C;
  --human-light:#FDEDEC;
  --human-dark:#C0392B;
  --ai:#1A73E8;
  --ai-light:#E8F0FE;
  --ai-dark:#1557B0;
  --bg:#F7F8FA;
  --card:#FFFFFF;
  --text:#2D3436;
  --text-light:#636E72;
  --border:#E8EAED;
  --shadow:0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.1);
  --radius:16px;
}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* ===== Landing Page ===== */
#landing{
  height:100vh;
  height:100dvh;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#E84C3D;
  overflow:hidden;
  position:relative;
}
.landing-side{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:88px 20px 40px;
  cursor:pointer;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.landing-side.red{background:#E84C3D;color:rgba(255,255,255,.96);}
.landing-side.blue{background:#1A73E8;color:rgba(255,255,255,.96);}
.landing-side::before{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse 70% 55% at 50% 25%,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 70%);
  pointer-events:none;
  z-index:0;
}
.landing-side.red::after{
  content:'';
  position:absolute;
  right:0;top:0;bottom:0;width:0;
  background:transparent;
  pointer-events:none;
  z-index:1;
}
.landing-side .side-stack{
  position:relative;
  z-index:3;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  max-width:280px;
  width:100%;
  height:100%;
  justify-content:flex-start;
  padding-top:30%;
  gap:0;
}
.landing-side .side-tag{
  font-size:clamp(9px,1.05vw,11px);
  font-weight:600;
  letter-spacing:clamp(3px,.42vw,5px);
  opacity:.55;
  text-transform:uppercase;
  margin-bottom:clamp(22px,3.2vh,36px);
  color:rgba(255,255,255,.85);
}
.landing-side .side-name{
  font-size:clamp(26px,3.4vw,40px);
  font-weight:800;
  letter-spacing:clamp(1.5px,.28vw,3.5px);
  line-height:1.1;
  margin-bottom:clamp(8px,1.6vh,16px);
  color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.08);
}
.landing-side .side-sub{
  font-size:clamp(9.5px,.95vw,12px);
  font-weight:500;
  letter-spacing:clamp(1.5px,.25vw,3px);
  opacity:.6;
  margin-bottom:clamp(6px,1.1vh,12px);
  color:rgba(255,255,255,.95);
}
.landing-side .side-dots{
  font-size:clamp(9.5px,.95vw,12px);
  font-weight:400;
  letter-spacing:clamp(.5px,.1vw,1.2px);
  opacity:.75;
  color:rgba(255,255,255,.98);
  margin-bottom:0;
}
.landing-side .side-cta{
  position:absolute;
  z-index:3;
  left:50%;
  bottom:30%;
  transform:translateX(-50%);
  font-size:clamp(10.5px,1.05vw,13px);
  font-weight:500;
  letter-spacing:clamp(4px,.55vw,7px);
  padding:clamp(10px,1.4vh,14px) 0;
  width:clamp(150px,16vw,200px);
  text-align:center;
  border-top:1px solid rgba(255,255,255,.5);
  border-bottom:1px solid rgba(255,255,255,.5);
  transition:all .35s cubic-bezier(.2,.7,.2,1);
  padding-left:6px;
}
.landing-side:hover .side-cta{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.7);letter-spacing:8px;}
.landing-side:active .side-cta{background:rgba(255,255,255,.18);}
.landing-poem-top{
  position:absolute;
  top:clamp(16px,2.4vh,28px);
  left:0;
  right:0;
  z-index:5;
  text-align:center;
  font-weight:300;
  line-height:1.5;
  pointer-events:none;
  padding:0 20px;
}
.landing-poem-top .line1{
  font-size:clamp(9.5px,1vw,12px);
  letter-spacing:clamp(3px,.55vw,7px);
  color:rgba(255,255,255,.85);
  font-weight:400;
  text-transform:uppercase;
  margin-bottom:6px;
}
.landing-poem-top .line1::before,.landing-poem-top .line1::after{
  content:'';
  display:inline-block;
  width:clamp(10px,1.4vw,22px);height:1px;
  background:rgba(255,255,255,.5);
  vertical-align:middle;
  margin:0 clamp(6px,.8vw,14px);
}
.landing-poem-top .line2{
  font-size:clamp(8.5px,.9vw,11px);
  letter-spacing:clamp(1.5px,.28vw,3.5px);
  color:rgba(255,255,255,.6);
  font-weight:300;
}
.landing-credit{
  position:absolute;
  left:0;
  right:0;
  bottom:clamp(14px,2.4vh,32px);
  z-index:6;
  text-align:center;
  font-weight:300;
  color:rgba(255,255,255,.82);
  pointer-events:none;
  padding:0 20px;
  line-height:1.75;
  font-size:clamp(8.5px,.92vw,11.5px);
  letter-spacing:.6px;
  white-space:nowrap;
  display:flex;
  align-items:baseline;
  justify-content:center;
}
.landing-credit .credit-key{
  font-weight:700;
  color:#fff;
  letter-spacing:clamp(.8px,.13vw,1.6px);
  position:relative;
  padding-bottom:2px;
}
.landing-credit .credit-full{
  flex:0 0 auto;
}
.landing-credit .credit-sep{
  display:inline-block;
  margin:0 14px;
  color:rgba(255,255,255,.6);
  font-weight:300;
  flex:0 0 auto;
  position:relative;
  z-index:6;
}
.landing-credit .credit-key{
  font-weight:700;
  color:#fff;
  letter-spacing:1.4px;
  position:relative;
  padding-bottom:2px;
}
.landing-credit .credit-key::after{
  content:'';
  position:absolute;
  left:8%;
  right:8%;
  bottom:0;
  height:1px;
  background:rgba(255,255,255,.85);
}
@media(max-width:600px){
  .landing-side{padding:78px 12px 30px;}
  .landing-side .side-stack{max-width:240px;padding-top:24%;}
  .landing-poem-top .line1{letter-spacing:3px;}
  .landing-poem-top .line1::before,.landing-poem-top .line1::after{width:10px;margin:0 6px;}
  .landing-poem-top .line2{letter-spacing:1.5px;}
  .landing-credit .credit-sep{margin:0 9px;}
  .landing-credit{white-space:normal;line-height:1.65;}
}

/* ===== Top Tab Switcher ===== */
.top-tabs{
  position:sticky;
  top:0;
  z-index:200;
  background:#fff;
  display:flex;
  border-bottom:1px solid #E8EAED;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.top-tabs .tab{
  flex:1;
  text-align:center;
  padding:14px 8px 12px;
  font-size:14px;
  font-weight:600;
  color:var(--text-light);
  cursor:pointer;
  position:relative;
  transition:color .2s;
  background:transparent;
  border:none;
  -webkit-tap-highlight-color:transparent;
}
.top-tabs .tab.active.red{color:var(--human);}
.top-tabs .tab.active.blue{color:var(--ai);}
.top-tabs .tab .tab-sub{
  display:block;
  font-size:10px;
  font-weight:500;
  color:#999;
  margin-top:2px;
  letter-spacing:.3px;
}
.top-tabs .tab.active.red .tab-sub{color:var(--human);}
.top-tabs .tab.active.blue .tab-sub{color:var(--ai);}
.top-tabs .tab.active::after{
  content:'';
  position:absolute;
  left:50%;transform:translateX(-50%);
  bottom:0;
  width:32px;height:3px;
  border-radius:2px;
}
.top-tabs .tab.active.red::after{background:var(--human);}
.top-tabs .tab.active.blue::after{background:var(--ai);}
.top-tabs .tab .badge{
  display:inline-block;
  font-size:9px;
  padding:1px 5px;
  border-radius:8px;
  background:#F1F3F5;
  color:#999;
  margin-left:4px;
  font-weight:500;
}
.top-tabs .tab.active.red .badge{background:var(--human-light);color:var(--human);}
.top-tabs .tab.active.blue .badge{background:var(--ai-light);color:var(--ai);}

/* ===== Assessment / Results Container ===== */
#stage{display:none;min-height:100vh;min-height:100dvh;padding-bottom:80px;}
#stage.show{display:block;}

/* Theme accents: human = red, ai = blue (default fallback uses current triangle) */
body.theme-human{--accent:var(--human);--accent-light:var(--human-light);--accent-dark:var(--human-dark);}
body.theme-ai{--accent:var(--ai);--accent-light:var(--ai-light);--accent-dark:var(--ai-dark);}

/* ===== Step Pager (one step per "page") ===== */
.dim-step{display:none;}
.dim-step.show{display:block;animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.progress-bar-wrap{
  padding:14px 20px 12px;
  background:#fff;
  border-bottom:1px solid #F1F3F5;
}
.progress-bar-wrap .top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.progress-bar-wrap .dim-label{font-size:14px;font-weight:600;}
.progress-bar-wrap .progress-text{font-size:12px;color:var(--text-light);}
.progress-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width .4s ease;}

.assessment-container{
  max-width:760px;
  margin:0 auto;
  padding:24px 20px;
}
.dim-header{
  text-align:center;
  margin-bottom:22px;
}
.dim-header .dim-icon{
  width:52px;height:52px;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  font-weight:700;
  color:#fff;
  margin:0 auto 10px;
}
.dim-header h2{font-size:20px;font-weight:700;margin-bottom:4px;}
.dim-header p{font-size:13px;color:var(--text-light);line-height:1.5;}

.submodule-group{
  background:var(--card);
  border-radius:var(--radius);
  padding:22px 20px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.submodule-group .sub-header{
  display:flex;align-items:center;gap:8px;
  margin-bottom:14px;
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
}
.submodule-group .sub-tag{
  font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:5px;color:#fff;
}
.submodule-group .sub-name{font-size:15px;font-weight:600;}

.question-item{
  padding:14px 0;
  border-bottom:1px solid #F1F3F5;
}
.question-item:last-child{border-bottom:none;}
.question-item .q-text{
  font-size:14.5px;margin-bottom:10px;
  display:flex;gap:8px;line-height:1.6;
}
.question-item .q-num{
  color:var(--text-light);font-weight:600;flex-shrink:0;
}
.question-item .q-reverse{
  font-size:10px;margin-left:6px;padding:1px 5px;border-radius:3px;
  white-space:nowrap;
  color:#fff;
  background:#888;
}

.scale-options{display:flex;gap:6px;}
.scale-btn{
  flex:1;padding:10px 2px;border:2px solid var(--border);
  border-radius:10px;background:#fff;cursor:pointer;
  text-align:center;
  transition:all .2s;
  -webkit-tap-highlight-color:transparent;
}
.scale-btn .scale-num{display:block;font-size:18px;font-weight:700;margin-bottom:1px;}
.scale-btn .scale-label{font-size:10px;color:var(--text-light);}
.scale-btn.selected{border-color:currentColor;color:#fff;}
.scale-btn.selected .scale-label{color:rgba(255,255,255,.85);}
.scale-btn.red.selected{background:var(--human);border-color:var(--human);}
.scale-btn.blue.selected{background:var(--ai);border-color:var(--ai);}

.nav-buttons{
  display:flex;justify-content:space-between;gap:12px;
  max-width:760px;margin:0 auto;padding:0 20px;
}
.btn-nav{
  flex:1;padding:12px 16px;
  border:2px solid var(--border);
  border-radius:12px;background:#fff;
  font-size:15px;font-weight:600;
  cursor:pointer;
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
}
.btn-nav.primary-red{background:var(--human);color:#fff;border-color:var(--human);}
.btn-nav.primary-blue{background:var(--ai);color:#fff;border-color:var(--ai);}
.btn-nav:disabled{opacity:.4;cursor:not-allowed;}

/* ===== Results ===== */
.dim-step.results-show{padding:24px 0;}
.results-container{max-width:800px;margin:0 auto;padding:0 20px;}
.results-header{text-align:center;margin-bottom:24px;}
.results-header h1{font-size:24px;font-weight:700;margin-bottom:6px;}
.results-header p{font-size:13px;color:var(--text-light);}

.dim-cards{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  margin-bottom:20px;
}
.dim-card{
  background:var(--card);
  border-radius:14px;
  padding:18px 12px;
  text-align:center;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.dim-card::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:3px;
}
.dim-card.aes::before{background:var(--human);}
.dim-card.sce::before{background:var(--human);}
.dim-card.sys::before{background:var(--ai);}
.dim-card.ski::before{background:var(--ai);}
.dim-card.inn::before{background:#7B68EE;}
.dim-card.dat::before{background:#7B68EE;}
.dim-card .dim-name{font-size:12px;color:var(--text-light);margin-bottom:6px;}
.dim-card .dim-level{font-size:18px;font-weight:700;margin-bottom:3px;}
.dim-card .dim-sub{font-size:11px;color:var(--text-light);}

.score-section{
  background:var(--card);
  border-radius:14px;
  padding:22px 20px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.score-section h3{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.score-section h3 .dot{width:8px;height:8px;border-radius:50%;}
.score-bar-item{margin-bottom:11px;}
.score-bar-item .bar-header{
  display:flex;justify-content:space-between;
  font-size:12.5px;margin-bottom:5px;
}
.score-bar-item .bar-name{font-weight:500;}
.score-bar-item .bar-score{font-weight:600;color:var(--text-light);}
.score-bar-track{height:7px;background:#F1F3F5;border-radius:4px;overflow:hidden;}
.score-bar-fill{height:100%;border-radius:4px;transition:width .8s ease;}
.score-bar-fill.pass{background:linear-gradient(90deg,#2ECC71,#27AE60);}
.score-bar-fill.fail{background:linear-gradient(90deg,#F39C12,#E67E22);}

.analysis-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;
}
.analysis-card{
  background:var(--card);
  border-radius:14px;
  padding:18px;
  box-shadow:var(--shadow);
}
.analysis-card h3{
  font-size:14px;font-weight:600;margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.analysis-card.strength h3{color:#27AE60;}
.analysis-card.weakness h3{color:#E67E22;}
.analysis-card ul{list-style:none;}
.analysis-card li{
  font-size:12.5px;color:var(--text-light);
  padding:5px 0 5px 18px;position:relative;line-height:1.55;
}
.analysis-card.strength li::before{content:'+';position:absolute;left:0;color:#27AE60;font-weight:700;}
.analysis-card.weakness li::before{content:'!';position:absolute;left:0;color:#E67E22;font-weight:700;}

.bottleneck-card{
  background:linear-gradient(135deg,#FFF5F5,#FFF0F0);
  border:1px solid #FFD0D0;
  border-radius:14px;padding:18px;margin-bottom:14px;
}
.bottleneck-card h3{font-size:14px;font-weight:600;color:#E74C3C;margin-bottom:8px;}
.bottleneck-card p{font-size:13px;color:#C0392B;line-height:1.7;}

.growth-plan{
  border-radius:14px;padding:24px 20px;
  color:#fff;margin-bottom:14px;
}
.growth-plan.red{background:linear-gradient(135deg,#FF6B6B 0%,#E74C3C 60%,#C0392B 100%);}
.growth-plan.blue{background:linear-gradient(135deg,#4A90E2 0%,#1A73E8 60%,#1557B0 100%);}
.growth-plan .plan-tag{
  display:inline-block;font-size:11px;
  padding:3px 10px;background:rgba(255,255,255,.22);
  border-radius:5px;margin-bottom:12px;
}
.growth-plan h2{font-size:19px;font-weight:700;margin-bottom:6px;}
.growth-plan .plan-subtitle{font-size:13px;opacity:.85;margin-bottom:18px;line-height:1.6;}
.plan-section{margin-bottom:14px;}
.plan-section .plan-label{font-size:11px;opacity:.7;margin-bottom:6px;letter-spacing:1px;}
.plan-tasks{list-style:none;margin-top:6px;}
.plan-tasks li{padding:6px 0 6px 26px;position:relative;font-size:13.5px;line-height:1.65;}
.plan-tasks li::before{content:'';position:absolute;left:0;top:12px;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.22);}
.plan-tasks li::after{content:attr(data-num);position:absolute;left:5px;top:11px;font-size:11px;font-weight:700;}
.plan-stop{background:rgba(255,255,255,.12);border-radius:8px;padding:11px 12px;font-size:13px;line-height:1.6;}
.plan-timeline{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.timeline-item{flex:1;min-width:90px;background:rgba(255,255,255,.12);border-radius:8px;padding:11px 8px;text-align:center;}
.timeline-item .tl-label{font-size:10px;opacity:.7;margin-bottom:3px;}
.timeline-item .tl-value{font-size:13px;font-weight:600;line-height:1.4;}

.radar-section{
  background:var(--card);
  border-radius:14px;padding:20px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
  text-align:center;
  overflow-x:auto;
}
.radar-section h3{font-size:15px;font-weight:600;margin-bottom:12px;text-align:left;}
#radar-svg{max-width:100%;height:auto;}

.actions{display:flex;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap;padding:0 20px;}
.btn-action{
  padding:11px 22px;
  border:2px solid var(--border);
  border-radius:10px;
  background:#fff;
  font-size:14px;font-weight:600;
  cursor:pointer;
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
}
.btn-action.primary-red{background:var(--human);color:#fff;border-color:var(--human);}
.btn-action.primary-blue{background:var(--ai);color:#fff;border-color:var(--ai);}

/* ===== Floating Widget ===== */
.bf-float{position:fixed;z-index:9999;user-select:none;-webkit-user-select:none;}
.bf-trigger{
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,#0ea5e9,#0369a1);
  box-shadow:0 4px 14px rgba(14,165,233,.4),0 2px 6px rgba(0,0,0,.12);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:24px;color:#fff;
  transition:transform .25s,box-shadow .25s;
  border:none;outline:none;-webkit-tap-highlight-color:transparent;position:relative;
}
.bf-trigger:hover{transform:scale(1.08);}
.bf-trigger:active{transform:scale(.95);}
.bf-trigger .bf-pulse{position:absolute;width:100%;height:100%;border-radius:50%;background:rgba(14,165,233,.35);animation:bfpulse 2s ease-in-out infinite;pointer-events:none;}
@keyframes bfpulse{0%,100%{transform:scale(1);opacity:.5;}50%{transform:scale(1.45);opacity:0;}}
.bf-popup{
  position:absolute;bottom:58px;right:0;
  background:#1a1a1a;color:#fff;
  padding:9px 14px;
  border-radius:8px;
  white-space:nowrap;
  font-size:12.5px;
  letter-spacing:.3px;
  font-weight:500;
  box-shadow:0 6px 20px rgba(0,0,0,.22);
  opacity:0;visibility:hidden;
  transform:translateY(6px);
  transition:all .25s ease;
  pointer-events:none;
}
.bf-popup.show{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto;}
.bf-popup::after{
  content:'';position:absolute;
  right:18px;bottom:-5px;
  width:10px;height:10px;
  background:#1a1a1a;
  transform:rotate(45deg);
}
.bf-popup .bf-popup-handle{
  display:inline-block;
  width:18px;height:18px;
  border-radius:50%;
  background:linear-gradient(135deg,#0ea5e9,#0369a1);
  vertical-align:-4px;
  margin-right:6px;
  font-size:11px;
  text-align:center;

// ===== State =====

// ===== Navigation =====
function enter(which){
  // hide landing, show stage
  document.getElementById('landing').style.display = 'none';
  document.getElementById('stage').style.display = 'block';
  document.getElementById('stage').classList.add('show');
  document.getElementById('bfFloat').style.display = 'block';
  document.body.classList.remove('theme-human','theme-ai');
  document.body.classList.add(which === 'human' ? 'theme-human' : 'theme-ai');

  // if switching to a new triangle, reset its step; if it has results, go to results step
  state.current = which;
  if(state.completed[which]){
    state.currentStep = 3; // results
  } else {
    // try to resume from last step in progress
    const t = TRIANGLES[which];
    let resumeStep = 0;
    for(let i=0;i<t.dimKeys.length;i++){
      const dq = t.questions.filter(q => q.dim === t.dimKeys[i]);
      if(dq.every(q => state.answers[which][q.id] !== undefined)){
        resumeStep = i + 1;
      } else {
        break;
      }
    }
    state.currentStep = Math.min(resumeStep, 2);
  }
  updateTabs();
  renderStep();
  window.scrollTo({top:0,behavior:'instant'});
}

function backToLanding(){
  if(state.completed.human || state.completed.ai){
    if(!confirm('已完成的测评结果会保留。确认回到首页？')) return;
  }
  document.getElementById('stage').style.display = 'none';
  document.getElementById('stage').classList.remove('show');
  document.getElementById('landing').style.display = 'grid';
  document.getElementById('bfFloat').style.display = 'none';
  document.getElementById('bfPopup').classList.remove('show');
  document.body.classList.remove('theme-human','theme-ai');
  window.scrollTo({top:0,behavior:'instant'});
}

function updateTabs(){
  ['human','ai'].forEach(k => {
    const tab = document.getElementById('tab-'+k);
    const t = TRIANGLES[k];
    tab.classList.remove('active','red','blue');
    if(k === state.current) tab.classList.add('active', t.color);
    const badge = document.getElementById('badge-'+k);
    if(state.completed[k]){
      badge.textContent = '已测';
    } else {
      const answered = Object.keys(state.answers[k]).length;
      const total = t.questions.length;
      if(answered === 0) badge.textContent = '未测';
      else if(answered < total) badge.textContent = answered + '/' + total;
      else badge.textContent = '已测';
    }
  });
}

function renderStep(){
  const t = TRIANGLES[state.current];
  const container = document.getElementById('step-container');
  if(state.currentStep < 3){
    renderDimensionStep(t);
  } else {
    renderResultsStep(t);
  }
}

function renderDimensionStep(t){
  const dimKey = t.dimKeys[state.currentStep];
  const dim = t.dimensions[dimKey];
  const dimQuestions = t.questions.filter(q => q.dim === dimKey);

  // Use icon mapping; human icons are letters (A/S/I), AI uses emojis

      <div class="progress-bar-wrap">
        <div class="top-row">

        html += `

function selectAnswer(qid, score){
  state.answers[state.current][qid] = score;
  document.querySelectorAll(`.scale-btn[data-qid="${qid}"]`).forEach(btn => {
    btn.classList.remove('selected');

    }
  });
  updateNextButton();
}

function updateNextButton(){
  const t = TRIANGLES[state.current];
  const dimKey = t.dimKeys[state.currentStep];
  const dimQuestions = t.questions.filter(q => q.dim === dimKey);
  const allAnswered = dimQuestions.every(q => state.answers[state.current][q.id] !== undefined);
  const btn = document.getElementById('btn-next');
  if(btn) btn.disabled = !allAnswered;
}

function prevStep(){
  if(state.currentStep > 0){
    state.currentStep--;
    renderStep();
    window.scrollTo({top:0,behavior:'instant'});
  }
}

function nextStep(){
  const t = TRIANGLES[state.current];
  const dimKey = t.dimKeys[state.currentStep];
  const dimQuestions = t.questions.filter(q => q.dim === dimKey);
  const allAnswered = dimQuestions.every(q => state.answers[state.current][q.id] !== undefined);
  if(!allAnswered){
    alert('请完成当前维度所有题目的评分');
    return;
  }
  if(state.currentStep < 2){
    state.currentStep++;
    renderStep();
    window.scrollTo({top:0,behavior:'instant'});
  } else {
    state.completed[state.current] = true;
    state.currentStep = 3;
    updateTabs();
    renderResultsStep(t);
    window.scrollTo({top:0,behavior:'instant'});
  }
}

// ===== Scoring =====
function calculateScores(t, which){
  const answers = state.answers[which];
  const scores = {};
  for(const subKey of Object.keys(t.subModules)){
    const subQuestions = t.questions.filter(q => q.sub === subKey);
    let sum = 0;
    for(const q of subQuestions){
      let score = answers[q.id];
      if(q.reverse) score = 6 - score;
      sum += score;
    }
    scores[subKey] = sum / subQuestions.length;
  }
  const dimScores = {};
  for(const dimKey of Object.keys(t.dimensions)){
    const subs = t.dimensions[dimKey].subs;
    let sum = 0;
    for(const sub of subs) sum += scores[sub];
    dimScores[dimKey] = sum / subs.length;
  }
  return {subScores: scores, dimScores};
}

function determineLevel(t, dimKey, subScores){
  const subs = t.dimensions[dimKey].subs;
  let highestPassIdx = -1;
  for(let i=0;i<subs.length;i++){
    if(subScores[subs[i]] >= 3.5) highestPassIdx = i;
    else break;
  }
  if(highestPassIdx === -1){
    return { level:'未建立', levelSub:null, nextSub:subs[0], nextSubName:t.subModules[subs[0]].name };
  }
  const passedSub = subs[highestPassIdx];
  const isHighest = highestPassIdx === subs.length - 1;
  return {
    level:t.subModules[passedSub].name,
    levelSub:passedSub, levelSubName:t.subModules[passedSub].name,
    nextSub: isHighest ? null : subs[highestPassIdx+1],
    nextSubName: isHighest ? null : t.subModules[subs[highestPassIdx+1]].name,
    isHighest
  };
}

// ===== Results =====
function renderResultsStep(t){
  const which = state.current;
  const {subScores, dimScores} = calculateScores(t, which);
  const levels = {};
  t.dimKeys.forEach(k => levels[k] = determineLevel(t, k, subScores));

  const sortedSubs = Object.keys(subScores).sort((a,b) => subScores[b] - subScores[a]);
  const strengths = sortedSubs.slice(0,3).filter(s => subScores[s] >= 3.5);
  const weaknesses = sortedSubs.slice(-3).filter(s => subScores[s] < 3.5);

  const dimAvgs = t.dimKeys.map(k => ({key:k, score:dimScores[k], level:levels[k]}))
    .sort((a,b) => a.score - b.score);
  const weakestDim = dimAvgs[0];
  const weakestLevel = weakestDim.level;
  const bottleneckSub = weakestLevel.nextSub || weakestLevel.levelSub;
  const bottleneckTask = t.taskMatrix[bottleneckSub];

  const secondWeakest = dimAvgs[1];
  const secondLevel = secondWeakest.level;
  const supportSub = secondLevel.nextSub || secondLevel.levelSub;
  const supportTask = t.taskMatrix[supportSub];

  const mainTheme = t.mainThemes[weakestDim.key];
  const weakestAvg = weakestDim.score;
  let estTime;
  if(weakestAvg <= 2.4) estTime = '10-14 周';
  else if(weakestAvg <= 3.2) estTime = '8-12 周';
  else if(weakestAvg <= 4.0) estTime = '6-8 周';
  else estTime = '4-6 周';

  const nextTarget = weakestLevel.nextSub
    ? `${t.subModules[weakestLevel.nextSub].name}（${weakestLevel.nextSub}）`
    : '维持最高段位，持续深耕';

  const strengthTexts = strengths.map(s =>
    `${t.subModules[s].name}（${s}）得分 ${subScores[s].toFixed(1)}，${t.subModules[s].desc}`
  );
  if(strengthTexts.length === 0){
    strengthTexts.push('目前各模块尚在起步阶段，所有方向都有巨大成长空间');
  }
  const weaknessTexts = weaknesses.map(s =>
    `${t.subModules[s].name}（${s}）得分 ${subScores[s].toFixed(1)}，${t.subModules[s].desc}`
  );
  if(weaknessTexts.length === 0){
    weaknessTexts.push('各模块均已达较高水平，建议聚焦从"优秀"到"卓越"的突破');
  }

  const isAI = which === 'ai';
  const accent = isAI ? 'blue' : 'red';
  const cardCls = isAI ? ['sce','ski','dat'] : ['aes','sys','inn'];
  const iconMap = isAI ? ['⭐','💪','📊'] : ['A','S','I'];

  let html = `
    <div class="dim-step results-show show">
      <div class="results-container">
        <div class="results-header">
          <h1>你的 ${t.titleShort}</h1>
          <p>${t.subtitle}</p>
        </div>

        <div class="dim-cards">
          ${t.dimKeys.map((k,i) => `
            <div class="dim-card ${cardCls[i]}">
              <div class="dim-name">${iconMap[i]} ${t.dimensions[k].name}</div>
              <div class="dim-level">${levels[k].level}</div>
              <div class="dim-sub">${levels[k].levelSub ? levels[k].levelSub : t.dimensions[k].subs.join('-')} · 均分 ${dimScores[k].toFixed(1)}</div>
            </div>
          `).join('')}
        </div>

        <div class="radar-section">
          <h3>各模块得分全景图</h3>
          ${renderRadarChart(t, subScores)}
        </div>
  `;

  t.dimKeys.forEach((dimKey,i) => {
    const dim = t.dimensions[dimKey];
    html += `
      <div class="score-section">
        <h3><span class="dot" style="background:${dim.color};"></span>${dim.name}维度 · 各模块得分</h3>
    `;
    dim.subs.forEach(sub => {
      const score = subScores[sub];
      const passed = score >= 3.5;
      const pct = (score/5)*100;
      html += `
        <div class="score-bar-item">
          <div class="bar-header">
            <span class="bar-name">${sub} ${t.subModules[sub].name}</span>
            <span class="bar-score">${score.toFixed(1)} / 5.0 ${passed ? '✓' : ''}</span>
          </div>
          <div class="score-bar-track">
            <div class="score-bar-fill ${passed?'pass':'fail'}" style="width:${pct}%;"></div>
          </div>
        </div>
      `;
    });
    html += `</div>`;
  });

  html += `
        <div class="analysis-grid">
          <div class="analysis-card strength">
            <h3>核心优势</h3>
            <ul>${strengthTexts.map(t => `<li>${t}</li>`).join('')}</ul>
          </div>
          <div class="analysis-card weakness">
            <h3>核心短板</h3>
            <ul>${weaknessTexts.map(t => `<li>${t}</li>`).join('')}</ul>
          </div>
        </div>

        <div class="bottleneck-card">
          <h3>核心瓶颈</h3>
          <p>当前最大瓶颈在 <strong>${t.dimensions[weakestDim.key].name}</strong> 维度（段位：<strong>${weakestLevel.level}</strong>）。下一个待突破的模块是 <strong>${bottleneckSub} ${t.subModules[bottleneckSub].name}</strong>。${bottleneckTask.focus}，这是当前阶段最关键的成长杠杆。</p>
        </div>

        <div class="growth-plan ${accent}">
          <span class="plan-tag">90天成长计划</span>

  document.getElementById('step-container').innerHTML = html;

  setTimeout(() => {

function retakeCurrent(){
  if(!confirm('确定要重新测评' + TRIANGLES[state.current].name + '？现有答案会清空。')) return;
  state.answers[state.current] = {};
  state.completed[state.current] = false;
  state.currentStep = 0;
  updateTabs();
  renderStep();
  window.scrollTo({top:0,behavior:'instant'});
}

// ===== Radar Chart (SVG) =====
function renderRadarChart(t, subScores){
  const allSubs = t.dimKeys.flatMap(k => t.dimensions[k].subs);
  const n = allSubs.length;
  const size = Math.max(360, 36 * n);
  const cx = size/2;
  const cy = size/2;
  const maxR = Math.min(140, size/2 - 50);
  const angleStep = (2*Math.PI)/n;

  let gridSVG = '';
  for(let r=1;r<=5;r++){
    const radius = (maxR*r)/5;
    gridSVG += `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="#E8EAED" stroke-width="1"/>`;
  }
  let gridLines = '';
  for(let i=0;i<n;i++){
    const angle = i*angleStep - Math.PI/2;
    const x = cx + maxR*Math.cos(angle);
    const y = cy + maxR*Math.sin(angle);
    gridLines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E8EAED" stroke-width="1"/>`;
  }

  let dataPoints = '';
  for(let i=0;i<n;i++){
    const sub = allSubs[i];
    const score = subScores[sub];
    const angle = i*angleStep - Math.PI/2;
    const r = (maxR*score)/5;
    const x = cx + r*Math.cos(angle);
    const y = cy + r*Math.sin(angle);
    dataPoints += `${x},${y} `;
  }
  const isAI = state.current === 'ai';
  const polyColor = isAI ? '#1A73E8' : '#E74C3C';
  const polyFill = isAI ? 'rgba(26,115,232,0.15)' : 'rgba(231,76,60,0.15)';
  const dataPath = `<polygon points="${dataPoints.trim()}" fill="${polyFill}" stroke="${polyColor}" stroke-width="2"/>`;

  let dataDots = '';
  for(let i=0;i<n;i++){
    const sub = allSubs[i];
    const score = subScores[sub];
    const angle = i*angleStep - Math.PI/2;
    const r = (maxR*score)/5;
    const x = cx + r*Math.cos(angle);
    const y = cy + r*Math.sin(angle);
    const color = score >= 3.5 ? '#27AE60' : '#E67E22';
    dataDots += `<circle cx="${x}" cy="${y}" r="4" fill="${color}" stroke="#fff" stroke-width="1.5"/>`;
  }

  let labels = '';
  for(let i=0;i<n;i++){
    const sub = allSubs[i];
    const angle = i*angleStep - Math.PI/2;
    const labelR = maxR + 22;
    const x = cx + labelR*Math.cos(angle);
    const y = cy + labelR*Math.sin(angle);
    const dim = t.subModules[sub].dim;
    const color = t.dimensions[dim].color;
    labels += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="600" fill="${color}">${sub}</text>`;
    const scoreR = maxR + 36;
    const sx = cx + scoreR*Math.cos(angle);
    const sy = cy + scoreR*Math.sin(angle);
    labels += `<text x="${sx}" y="${sy}" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#999">${subScores[sub].toFixed(1)}</text>`;
  }

  const thresholdR = (maxR*3.5)/5;
  const thresholdCircle = `<circle cx="${cx}" cy="${cy}" r="${thresholdR}" fill="none" stroke="#27AE60" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>`;

  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" id="radar-svg">
      ${gridSVG}
      ${gridLines}
      ${thresholdCircle}
      ${dataPath}
      ${dataDots}
      ${labels}
      <text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="9" fill="#bbb">达标线 3.5</text>
    </svg>
  `;
}

// ===== Floating Widget Logic =====
(function(){
  const floatEl = document.getElementById('bfFloat');
  const trigger = document.getElementById('bfTrigger');
  let isDragging = false;
  let startX, startY, initX, initY;
  let didDrag = false;

  trigger.addEventListener('mousedown', function(e){
    isDragging = true; didDrag = false;
    startX = e.clientX; startY = e.clientY;
    const rect = floatEl.getBoundingClientRect();
    initX = rect.left; initY = rect.top;
    floatEl.style.right = 'auto'; floatEl.style.bottom = 'auto';
    floatEl.style.left = initX + 'px'; floatEl.style.top = initY + 'px';
    floatEl.style.transform = 'none';
    e.preventDefault();
  });
  trigger.addEventListener('touchstart', function(e){
    const t = e.touches[0];
    isDragging = true; didDrag = false;
    startX = t.clientX; startY = t.clientY;
    const rect = floatEl.getBoundingClientRect();
    initX = rect.left; initY = rect.top;
    floatEl.style.right = 'auto'; floatEl.style.bottom = 'auto';
    floatEl.style.left = initX + 'px'; floatEl.style.top = initY + 'px';
    floatEl.style.transform = 'none';
    e.preventDefault();
  },{passive:false});

  function onMove(e){
    if(!isDragging) return;
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    const dx = cx - startX, dy = cy - startY;
    if(Math.hypot(dx, dy) > 5){ didDrag = true; }
    let nx = initX + dx, ny = initY + dy;
    nx = Math.max(0, Math.min(nx, window.innerWidth - floatEl.offsetWidth));
    ny = Math.max(0, Math.min(ny, window.innerHeight - floatEl.offsetHeight));
    floatEl.style.left = nx + 'px'; floatEl.style.top = ny + 'px';
    if(e.cancelable) e.preventDefault();
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove,{passive:false});

  function endDrag(){
    if(!isDragging) return;
    isDragging = false;
    if(!didDrag){ toggleBfPopup(); }
  }
  window.addEventListener('mouseup', endDrag);
  window.addEventListener('touchend', endDrag);
})();

function toggleBfPopup(){
  const p = document.getElementById('bfPopup');
  p.classList.toggle('show');
}
</script>
