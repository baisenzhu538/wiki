<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<defs>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#151a30" stroke-width="0.5"/>
  </pattern>
  <filter id="glowH" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowA" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowP" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glass" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
    <feOffset in="blur" dx="0" dy="1" result="off"/>
    <feFlood flood-color="rgba(255,255,255,0.03)" result="tint"/>
    <feComposite in="tint" in2="SourceAlpha" operator="in" result="tinted"/>
    <feMerge><feMergeNode in="tinted"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arrH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,1 L0,7 L9,4 z" fill="#FF4081"/></marker>
  <marker id="arrA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,1 L0,7 L9,4 z" fill="#FF4081"/></marker>
</defs>
