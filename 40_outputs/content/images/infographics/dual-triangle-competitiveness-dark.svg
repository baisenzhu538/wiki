<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">

  <defs>
    <!-- 背景网格 -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1f3a" stroke-width="0.5"/>
    </pattern>
    
    <!-- 人类三角渐变 -->
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.05"/>
    </linearGradient>
    
    <!-- AI三角渐变 -->
    <linearGradient id="aiGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00B8D4;stop-opacity:0.05"/>
    </linearGradient>
    
    <!-- 金色发光 -->
    <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 青色发光 -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 粉色发光 -->
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 箭头发光 -->
    <filter id="glowArrow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 玻璃面板效果 -->
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feFlood flood-color="rgba(255,255,255,0.05)" result="tint"/>
      <feComposite in="tint" in2="SourceAlpha" operator="in" result="tinted"/>
      <feMerge>
        <feMergeNode in="tinted"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 箭头标记 -->
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF4081"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF4081"/>
    </marker>
  </defs>


  <!-- 背景网格 -->
  <rect width="100%" height="100%" fill="#0a0e27"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Logo -->
  <rect x="50" y="25" width="60" height="36" rx="6" fill="#FFD700" filter="url(#glowGold)"/>
  <text x="80" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0a0e27">一堂</text>
  
  <!-- 主标题 -->
  <text x="600" y="55" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="bold" fill="#E8EAF6" filter="url(#glowGold)">
    一堂AI时代的竞争力 · 双三角模型
  </text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9FA8DA">
    Yitang Competitiveness in the AI Era: Dual Triangle Model
  </text>


  <!-- 左侧大三角 -->
  <polygon points="600,120 200,420 600,420" 
           fill="url(#humanGrad)" stroke="#FFD700" stroke-width="2" stroke-dasharray="8,4" filter="url(#glowGold)"/>


  <!-- 右侧大三角 -->
  <polygon points="600,120 600,420 1000,420" 
           fill="url(#aiGrad)" stroke="#00E5FF" stroke-width="2" stroke-dasharray="8,4" filter="url(#glowCyan)"/>


  <line x1="600" y1="120" x2="600" y2="420" 
        stroke="#E8EAF6" stroke-width="3" opacity="0.8"/>


  <!-- 创造力子项 -->
  <text x="420" y="85" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ 理解底层规律</text>
  <text x="420" y="102" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ 善于解放思想</text>
  <text x="420" y="119" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ 提出创造假设</text>
  
  <!-- 创造力标签 -->
  <text x="420" y="170" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="bold" fill="#FFD700" filter="url(#glowGold)">创造力</text>


  <!-- 场景子项 -->
  <text x="780" y="80" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ 业务拆解</text>
  <text x="780" y="97" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ ROI预判</text>
  <text x="780" y="114" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ AI打磨</text>
  <text x="780" y="131" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ 组织部署</text>
  
  <!-- 场景标签 -->
  <text x="780" y="175" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="bold" fill="#00E5FF" filter="url(#glowCyan)">场景</text>


  <!-- 左侧灵魂拷问 -->
  <rect x="60" y="210" width="180" height="100" rx="10" 
        fill="rgba(255, 215, 0, 0.08)" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#glass)"/>
  <text x="75" y="235" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#FFD700" font-weight="bold">灵魂考问</text>
  <text x="75" y="260" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">
    <tspan x="75" dy="0">"同样都会用AI，</tspan>
    <tspan x="75" dy="20">为什么不同人</tspan>
    <tspan x="75" dy="20">业务结果相差这么大？"</tspan>
  </text>


  <!-- 右侧灵魂拷问 -->
  <rect x="960" y="210" width="180" height="100" rx="10" 
        fill="rgba(0, 229, 255, 0.08)" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#glass)"/>
  <text x="975" y="235" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#00E5FF" font-weight="bold">灵魂考问</text>
  <text x="975" y="260" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">
    <tspan x="975" dy="0">"同样都是业务高手，</tspan>
    <tspan x="975" dy="20">为什么不同人</tspan>
    <tspan x="975" dy="20">AI结果相差这么大？"</tspan>
  </text>


  <!-- 中心公式 -->
  <text x="470" y="300" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" fill="#E8EAF6">人类三角</text>
  <text x="470" y="320" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#9FA8DA">持续让自己变强</text>
  
  <!-- 乘号 -->
  <text x="600" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FF4081" filter="url(#glowPink)">×</text>
  
  <text x="730" y="300" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" fill="#E8EAF6">AI三角</text>
  <text x="730" y="320" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#9FA8DA">持续使用AI更强</text>
  
  <!-- 上方箭头 左→右 -->
  <path d="M 520 250 Q 600 200 680 250" 
        fill="none" stroke="#FF4081" stroke-width="2.5" marker-end="url(#arrowGold)" filter="url(#glowArrow)"/>
  <text x="600" y="225" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#FF4081">人变强了，调教更强AI</text>
  
  <!-- 下方箭头 右→左 -->
  <path d="M 680 360 Q 600 410 520 360" 
        fill="none" stroke="#FF4081" stroke-width="2.5" marker-end="url(#arrowCyan)" filter="url(#glowArrow)"/>
  <text x="600" y="395" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#FF4081">有了强AI，辅助人变得更强</text>


  <!-- 分隔线 -->
  <line x1="100" y1="480" x2="1100" y2="480" stroke="#1a1f3a" stroke-width="1"/>
  
  <!-- 四维支撑标题 -->
  <text x="600" y="505" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#9FA8DA">四维支撑层（详细展开）</text>
  
  <!-- 1. 审美 -->
  <rect x="120" y="525" width="220" height="130" rx="8" 
        fill="rgba(255, 215, 0, 0.05)" stroke="#FFD700" stroke-width="1" filter="url(#glass)"/>
  <text x="230" y="550" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#FFD700" filter="url(#glowGold)">审美</text>
  <text x="140" y="575" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ 专业见识</text>
  <text x="140" y="595" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ 最佳实践</text>
  <text x="140" y="615" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ 评价标准</text>
  
  <!-- 2. 体系 -->
  <rect x="370" y="525" width="220" height="130" rx="8" 
        fill="rgba(255, 215, 0, 0.05)" stroke="#FFD700" stroke-width="1" filter="url(#glass)"/>
  <text x="480" y="550" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#FFD700" filter="url(#glowGold)">体系</text>
  <text x="390" y="575" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ 科学体系思维</text>
  <text x="390" y="595" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ 假设验证模型</text>
  <text x="390" y="615" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ 稳定知识结构</text>
  
  <!-- 3. 基本功 -->
  <rect x="620" y="525" width="220" height="130" rx="8" 
        fill="rgba(0, 229, 255, 0.05)" stroke="#00E5FF" stroke-width="1" filter="url(#glass)"/>
  <text x="730" y="550" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#00E5FF" filter="url(#glowCyan)">基本功</text>
  <text x="640" y="575" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#E8EAF6">✓ 基础: LLM提示词/智能体</text>
  <text x="640" y="595" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#E8EAF6">✓ 宽度: 多模态/AI工具库(∞)</text>
  <text x="640" y="615" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="11" fill="#E8EAF6">✓ 深度: 模型微调训练/工程化</text>
  
  <!-- 4. 数据 -->
  <rect x="870" y="525" width="220" height="130" rx="8" 
        fill="rgba(0, 229, 255, 0.05)" stroke="#00E5FF" stroke-width="1" filter="url(#glass)"/>
  <text x="980" y="550" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="bold" fill="#00E5FF" filter="url(#glowCyan)">数据</text>
  <text x="890" y="575" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ 非结构化数据</text>
  <text x="890" y="595" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ 结构化数据</text>
  <text x="890" y="615" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#E8EAF6">✓ 形成资产</text>


  <!-- 底部信息栏 -->
  <rect x="0" y="700" width="1200" height="150" fill="rgba(26, 31, 58, 0.8)"/>
  <text x="600" y="735" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#9FA8DA">
    版本更新于：2025.9.5 @北京一堂实验室
  </text>
  <text x="100" y="785" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="bold" fill="#E8EAF6">
    一堂 · 坚持只做必修课
  </text>
  <text x="100" y="815" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#9FA8DA">
    扫码辛苦学3天，不扫弯路走3年
  </text>
  
  <!-- 二维码占位 -->
  <rect x="1040" y="725" width="80" height="80" rx="4" fill="#E8EAF6" opacity="0.9"/>
  <rect x="1075" y="755" width="10" height="10" fill="#FF4081"/>

</svg>
