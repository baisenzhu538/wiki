description: "Use this skill when encountering complex system problems that cannot be quickly resolved. Applies scientific debugging methodology: hypothesis-driven investigation, cross-validation through multiple evidence sources, and minimal scoped fixes. Triggers: complex bugs with unclear causes, intermittent issues, performance problems, data inconsistencies."
scope: shared
trigger:
  natural_language:
    - 复杂bug原因不明、多假设排查
    - 间歇性问题、性能问题、数据不一致
    - 修了多次不好、需要根因分析
    - 系统性调试方法论
适用agent:
