# Cards with domain: yitang → add #domain/entrepreneurship
# Cards with domain: master → add #domain/knowledge-management + #method/thinking-tool
# Cards with domain: healthcare → add #domain/healthcare-it
# Cards with domain: ai-saas → add #domain/ai-engineering
