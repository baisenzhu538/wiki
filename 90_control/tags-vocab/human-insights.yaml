# human-insights 域维度轴 v0.1（词表 v0.3 实施首例——《成瘾》卡组试点）
# 维度框架：五维（专业/风控警示/受众/对象场景/经验）+ 来源轴（F-046）
# 规则：细=维度覆盖，不堆量；每卡 5-8 个跨轴词；判断类走字段不进 tags

axes:
  专业维度:      # 学科/机制层
    words: [神经科学, 多巴胺, 成瘾机制, 稳态, 对手过程, 行为改变, 决策科学, 行为设计, 心理学]
  对象维度:      # 讲什么
    words: [快乐, 疼痛, 奖励通路, 耐受性, 戒断, 复发, 习惯, 自我约束, 注意力, 拖延, 动机, 情绪]
  性质维度:      # 机制/框架/工具/边界
    words: [机制, 框架, 悖论, 工具, 方法, 边界, 反例, 实证]
  受众维度:      # 给谁用
    words: [自我管理者, 行为设计者, 产品设计者, 教练, 管理者, 创业者]
  经验维度:      # 隐性经验/实操词
    words: [避坑, 踩坑实录, 实操, 禁欲, 重置, 物理隔离, 时间窗口, 激进诚实, 图腾]
  来源维度:      # F-046 来源轴（本域首用）
    words: [拆书会, 书籍转述, 开放麦, Live, 口述, 外部报告]

