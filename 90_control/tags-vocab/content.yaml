# 规则：细=维度覆盖，不堆量；每卡 5-8 个跨轴词；判断类走字段不进 tags；来源名禁入
# 迭代规则：老顽童试点发现新词→王语嫣审词入轴→版本+0.1；索引不到→加词（双原则）
