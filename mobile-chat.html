<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>五绝 Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#1a1a2e;color:#eaeaea;height:100vh;display:flex;flex-direction:column}
header{background:#16213e;padding:12px 16px;text-align:center;border-bottom:2px solid #4A90D9;font-size:16px;font-weight:bold}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.5;font-size:15px;word-break:break-word}
.msg.user{align-self:flex-end;background:#4A90D9;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#0f3460;border-bottom-left-radius:4px}
.msg.bot pre{background:#16213e;padding:8px;border-radius:8px;overflow-x:auto;font-size:13px;margin:6px 0}
.msg.bot code{font-family:monospace;font-size:13px;background:#16213e;padding:2px 6px;border-radius:4px}
footer{background:#16213e;padding:10px 12px;display:flex;gap:8px;align-items:center;border-top:1px solid #333}
footer input{flex:1;background:#0f3460;border:none;color:#eaeaea;padding:12px 16px;border-radius:24px;font-size:15px;outline:none}
footer input::placeholder{color:#666}
footer button{background:#4A90D9;border:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0}
#typing{color:#666;font-size:13px;padding:4px 16px;display:none}
.agent-select{display:flex;gap:4px;justify-content:center;padding:6px 12px;background:#16213e;flex-wrap:wrap}
.agent-select button{background:#0f3460;border:1px solid #333;color:#999;padding:6px 12px;border-radius:16px;font-size:13px;cursor:pointer}
.agent-select button.on{background:#4A90D9;color:#fff;border-color:#4A90D9}
</style>
</head>
<body>

<header>🏯 五绝 Chat</header>

<div class="agent-select" id="agents">
  <button onclick="setAgent('laowantong','老顽童')">🃏 老顽童</button>
  <button onclick="setAgent('wangyuyan','王语嫣')">📖 王语嫣</button>
  <button onclick="setAgent('hongqigong','洪七公')">🎨 洪七公</button>
  <button onclick="setAgent('duanwangye','段王爷')">👑 段王爷</button>
  <button onclick="setAgent('huangyaoshi','黄药师')">💊 黄药师</button>
</div>

<div id="msgs">
  <div class="msg bot">👋 选一个 agent，开始对话</div>
</div>

<div id="typing">对方正在输入...</div>

<footer>
  <input id="inp" type="text" placeholder="说点什么..." autofocus>
  <button id="send" onclick="send()">↑</button>
</footer>

<script>
let agent = 'laowantong';
let agentName = '老顽童';

function setAgent(id, name) {
  agent = id; agentName = name;
  document.querySelectorAll('#agents button').forEach(b => b.classList.remove('on'));
  event.target.classList.add('on');
  document.getElementById('msgs').innerHTML += `<div class="msg bot">切换到 ${name}</div>`;
  document.getElementById('msgs').scrollTop = 99999;
}
document.querySelector('#agents button:first-child').classList.add('on');

async function send() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';

  addMsg(text, 'user');
  document.getElementById('typing').style.display = 'block';

  try {
    const r = await fetch('/agent/' + agent + '/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, agent_name: agentName})
    });
    const data = await r.json();
    document.getElementById('typing').style.display = 'none';
    addMsg(data.response || data.message || JSON.stringify(data), 'bot');
  } catch(e) {
    document.getElementById('typing').style.display = 'none';
    addMsg('连接失败: ' + e.message, 'bot');
  }
}

function addMsg(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = text.replace(/\n/g, '<br>').replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  document.getElementById('msgs').appendChild(div);
  div.scrollIntoView({behavior:'smooth'});
}

document.getElementById('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
