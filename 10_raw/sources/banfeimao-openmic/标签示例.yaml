--------
一句话结论
膳食指南将各类食物按份量标准化——每份40~50g为基准，方便日常食物计量和食谱设计，也有利于控制进食总量。
适用场景
日常烹饪中"一份到底是多少"的量化参考
食谱设计时的份量换算
营养教育中"用手估量食物"的科普
Agent回答"一份食物是多少"时调用
内容
什么是"份"
"份"是膳食指南用于定量指导的标准化单位。一份约等于40~50g可食部（约相当于一个人一口的量）。学会用"份"来衡量食物，可以不用秤也能合理搭配。
常见食物一份的估算方法
谷薯类（1份=生重约25~50g）
1份米/面 ≈ 半碗熟饭（约50g生米煮成）
1份薯类 ≈ 1个中等大小土豆/红薯
1个馒头 ≈ 约2份
蔬菜类（1份=100g）
1份叶菜 ≈ 双手一捧的量
1份番茄 ≈ 1个中等大小
水果类（1份=100g）
1个苹果/梨/橙 ≈ 约1.5~2份
1根香蕉 ≈ 约1.5份
肉鱼类（1份=40~50g生重）
1个鸡翅 ≈ 1份
1副扑克牌大小的瘦肉 ≈ 约2份
奶类
1份奶 ≈ 100ml液态奶 ≈ 12.5g奶粉 ≈ 10g干奶酪
成人每日份数参考（基于1600~2400kcal）
谷薯类：约4~6份/天
蔬菜：约3~5份/天（每份100g）
水果：约2~3.5份/天
动物性食物：约3~5份/天
奶类：约1.5份/天
可复用方式
健康科普中"怎么用手估量食物"
减重控量时的参考工具
营养课程中教授"份量"概念
Agent回答"一份食物到底多少"时调用
注意事项
生重和熟重差异大——米面熟重约为生重2~3倍，肉类熟重约为生重70%
不同食物的"份"对应的实际克数不同
儿童和老年人的份量应适当减少
来源
中国营养学会.《中国居民膳食指南（2022）》. 附录一常见食物的份量，第335-341页. 人民卫生出版社，2022.4.
